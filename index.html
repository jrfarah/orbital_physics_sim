<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070c'/%3E%3C/svg%3E" />
    <title>Orbital Data Centers · The Physics</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1 id="site-title"></h1>
        <nav id="tabbar" aria-label="Sections"></nav>
        <div id="top-tools">
          <button id="settings" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings-pop">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
              <path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6.1 6.1l1.6 1.6M16.3 16.3l1.6 1.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6" />
            </svg>
          </button>
          <div id="settings-pop" hidden>
            <label class="settings-row">
              <input id="presenter-toggle" type="checkbox" />
              Presenter mode
            </label>
            <p>Steadier frames on battery. Caps resolution, bloom, and the busiest effects.</p>
          </div>
        <button id="copy-link" type="button" aria-label="Copy link">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.7" d="M10 13a5 5 0 0 0 7.1.1l1.4-1.4a5 5 0 0 0-7.1-7.1L10 6" />
            <path fill="none" stroke="currentColor" stroke-width="1.7" d="M14 11a5 5 0 0 0-7.1-.1L5.5 12.3a5 5 0 0 0 7.1 7.1L14 18" />
          </svg>
        </button>
        </div>
      </header>
      <div id="shell">
        <aside id="hud"></aside>
        <div id="stage">
          <div id="canvas-host"></div>
          <div id="takeaway"></div>
        </div>
        <aside id="panel"></aside>
        <div id="sheet" hidden></div>
      </div>
    </div>
    <div id="toast" role="status"></div>
    <button id="gl-overlay" type="button" hidden>Graphics reset – tap to reload</button>
    <script>
      (function () {
        var node = document.createElement('div');
        node.id = 'boot-error';
        node.hidden = true;
        node.setAttribute('role', 'alert');
        var text = document.createElement('pre');
        var dismiss = document.createElement('button');
        dismiss.type = 'button';
        dismiss.textContent = 'Dismiss';
        dismiss.addEventListener('click', function () { node.hidden = true; });
        node.append(text, dismiss);
        function show(source, err) {
          var message = err && err.message ? err.message : String(err);
          if (String(message).indexOf('ResizeObserver loop') !== -1) return;
          var stack = err && err.stack ? String(err.stack).split('\n').slice(0, 6).join('\n') : '';
          var line = source + ': ' + message + (stack ? '\n' + stack : '');
          text.textContent = text.textContent ? text.textContent + '\n\n' + line : line;
          node.hidden = false;
        }
        window.__reportError = show;
        window.__bootHook = true;
        window.addEventListener('error', function (event) { show('error', event.error || event.message); });
        window.addEventListener('unhandledrejection', function (event) { show('unhandledrejection', event.reason); });
        if (document.body) document.body.append(node);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
